jobs:
  build:
    outputs:
      distro: "${{ steps.distro_check.outputs.distro }}"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: "recursive"
    - name: "Set up QEMU Emulation"
      uses: "docker/setup-qemu-action@v3"
      with:
        image: "tonistiigi/binfmt:latest"
    - name: "Test"
      uses: "devcontainers/ci@v0.3"
      with:
        push: "never"
        runCmd: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git-buildpackage
          export DEBEMAIL="46655663+BTobben@users.noreply.github.com"
          export DEBFULLNAME="BTobben"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -m GITHUB_RUNNER || true
          git branch -D main || true
          git switch -c main || true
          make dch
          make test deb
          git reset --hard HEAD~1
          rm ../*.deb
    - name: "Build"
      uses: "devcontainers/ci@v0.3"
      with:
        push: "never"
        runCmd: |
          set -euo pipefail
          make deb
    - id: "artifacts_path"
      name: "Workaround actions/upload-artifact#176"
      run: |
        echo "artifacts_path=$(realpath ..)" | tee -a "$GITHUB_OUTPUT"
      shell: "bash"
    - name: "Upload artifacts"
      uses: "actions/upload-artifact@v5"
      with:
        name: "${{ github.event.repository.name }}"
        path: |
          ${{ steps.artifacts_path.outputs.artifacts_path }}/*.deb
    - id: "distro_check"
      name: "Check if the latest version is releasable"
      run: |
        version="$(dpkg-parsechangelog -S Version)"
        version="${version//\~/.}"
        if [[ -n "$(git tag -l "$version")" ]]
        then
            echo "distro=UNRELEASED"
        else
            echo "distro=$(dpkg-parsechangelog -S Distribution)"
        fi | tee -a "$GITHUB_OUTPUT"
      shell: "bash"
  release:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && needs.build.outputs.distro != 'UNRELEASED' }}"
    needs: "build"
    permissions:
      contents: "write"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"
    - name: "Validate release-candidate tag"
      run: |
        if [[ ! "${{ inputs.release_tag }}" =~ ^v0\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]
        then
            echo "Release tag must be a v0.x.y-rcN test-release tag" >&2
            exit 1
        fi
      shell: "bash"
    - name: "Publish source-only test release"
      uses: "softprops/action-gh-release@v2"
      with:
        body: |
          Source-only test release for the documented AIC8800D80 MCU1 Arch integration.

          No firmware, generated firmware package, diagnostic bundle, or prebuilt kernel package is attached. Review the README, upstream relationship, hardware scope, and known limitations before installation.
        draft: false
        generate_release_notes: true
        prerelease: true
        tag_name: "${{ inputs.release_tag }}"
        target_commitish: "${{ github.sha }}"
        token: "${{ secrets.GITHUB_TOKEN }}"
name: "Build & source-only prerelease"
"on":
  merge_group: {}
  pull_request:
    paths-ignore:
    - "docs/**"
    - "theme/**"
    - "po/**"
    - "book.toml"
    - ".github/workflows/docs.yaml"
  push:
    branches:
    - "main"
    paths-ignore:
    - "docs/**"
    - "theme/**"
    - "po/**"
    - "book.toml"
    - ".github/workflows/docs.yaml"
  workflow_dispatch:
    inputs:
      publish_prerelease:
        default: false
        description: "Publish a source-only release candidate after the build passes"
        required: true
        type: "boolean"
      release_tag:
        default: "v0.1.0-rc1"
        description: "Release-candidate tag (v0.x.y-rcN)"
        required: true
        type: "string"
permissions:
  contents: "read"
