PACKAGE_NAME="aic8800-usb"
PACKAGE_VERSION="@PKGVER@"

# Bluetooth-first DKMS package: keep building the standalone aic_btusb module,
# and add only the aic_load_fw loader needed to validate D80 bring-up logs.  Do
# not build the fragile aic8800_fdrv path from the parent aic8800 Makefile.
#
# The BTUSB_DKMS_FLAGS placeholder is empty in the normal Arch/BlueZ package.
# PKGBUILD fills it with CONFIG_AIC8800_BLUEDROID_DIAG=y only when the user
# explicitly runs AIC8800_BLUEDROID_DIAG=1 makepkg, which makes aic_btusb expose
# the Android/Bluedroid /dev/aicbt_dev diagnostics without changing the default.
BTUSB_DKMS_FLAGS="@AIC8800_BTUSB_DKMS_FLAGS@"
# The separately packaged SDK V3 aic8800_fdrv imports the loader's RX-buffer
# pool ABI. Build that pool into aic_load_fw just like the proven parent-stack
# Makefile does.
LOADFW_DKMS_FLAGS="CONFIG_PREALLOC_RX_SKB=y"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/USB/driver_fw/drivers/aic_btusb ${BTUSB_DKMS_FLAGS} modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/USB/driver_fw/drivers/aic8800/aic_load_fw ${LOADFW_DKMS_FLAGS} modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/USB/driver_fw/drivers/aic_zlp_quirk modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/USB/driver_fw/drivers/aic_btusb ${BTUSB_DKMS_FLAGS} clean; make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/USB/driver_fw/drivers/aic8800/aic_load_fw ${LOADFW_DKMS_FLAGS} clean; make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/USB/driver_fw/drivers/aic_zlp_quirk clean"

# BUILT_MODULE_LOCATION entries are directories relative to the DKMS build root
# that contain the corresponding built .ko files.
BUILT_MODULE_NAME[0]="aic_btusb"
DEST_MODULE_NAME[0]="aic_btusb_usb"
BUILT_MODULE_LOCATION[0]="src/USB/driver_fw/drivers/aic_btusb"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Keep the loader destination name as aic_load_fw.  The built module's internal
# name is still aic_load_fw, so a renamed destination such as aic_load_fw_usb
# would be confusing to unload and would not replace the legacy runtime loader.
# Installing into /updates/dkms lets depmod prefer this DKMS-built instrumented
# loader over the legacy aic8800/1.0.0 copy while preserving normal modprobe use.
BUILT_MODULE_NAME[1]="aic_load_fw"
DEST_MODULE_NAME[1]="aic_load_fw"
BUILT_MODULE_LOCATION[1]="src/USB/driver_fw/drivers/aic8800/aic_load_fw"
DEST_MODULE_LOCATION[1]="/updates/dkms"

# Keep the distribution btusb transport, but add the vendor-required
# URB_ZERO_PACKET flag to ACL bulk OUT for the two exact D80 runtime IDs.
BUILT_MODULE_NAME[2]="aic_zlp_quirk"
BUILT_MODULE_LOCATION[2]="src/USB/driver_fw/drivers/aic_zlp_quirk"
DEST_MODULE_LOCATION[2]="/updates/dkms"

AUTOINSTALL="yes"
